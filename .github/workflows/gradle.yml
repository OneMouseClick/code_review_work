name: Java CI with Gradle

on:
  push:
    branches: [ "main", "sharapovdv" ]
  pull_request:
    branches: [ "main", "sharapovdv" ]
  schedule:
    - cron: '30 12 * * 3'  # Среда 12:30
    - cron: '0 22 * * 5'   # Пятница 22:00

jobs:
  build:
    strategy:
      matrix:
        java: [11, 17]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - java: '13' # Для не-LTS версий
            os: ubuntu-latest  # Явное указание OS
            distribution: zulu # Альтернативный дистрибутив
          - java: '13'
            os: macos-latest   # Полный перебор OS
            distribution: zulu
          - java: '13'
            os: windows-latest
            distribution: zulu
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Build and Test with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build test
